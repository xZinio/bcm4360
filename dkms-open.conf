PACKAGE_NAME="bcm4360-open"
# install.sh fills in the version of dkms.conf
PACKAGE_VERSION="@VERSION@"
AUTOINSTALL="yes"

# bcm4360_open alone, the open mac80211 driver (install.sh --open). A package
# of its own: when it does not build for a new kernel, bcm4360 (dkms.conf)
# still does, and bcm4360-fallback.service loads it in its place.
MAKE[0]="make KERNELRELEASE=${kernelver} -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build BCM4360_MODULES=bcm4360_open modules"

BUILT_MODULE_NAME[0]="bcm4360_open"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless"
