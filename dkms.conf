PACKAGE_NAME="bcm4360"
PACKAGE_VERSION="1.2.0"
AUTOINSTALL="yes"

# Both drivers: bcm4360 (Broadcom's core with the open layers) and bcm4360_open
# (no Broadcom code; loaded instead when install.sh --open was used)
MAKE[0]="make KERNELRELEASE=${kernelver} -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build BCM4360_MODULES='bcm4360 bcm4360_open' modules"

BUILT_MODULE_NAME[0]="bcm4360"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless"
BUILT_MODULE_NAME[1]="bcm4360_open"
DEST_MODULE_LOCATION[1]="/kernel/drivers/net/wireless"
