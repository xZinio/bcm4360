PACKAGE_NAME="bcm4360"
PACKAGE_VERSION="1.2.2"
AUTOINSTALL="yes"

# bcm4360 alone: Broadcom's core with the open layers, the default driver.
# bcm4360_open is a package of its own (dkms-open.conf, install.sh --open), so
# that it failing to build for a new kernel never keeps this one from being
# installed. The version is set here only; the Makefile and dkms-open.conf
# take it from this file.
MAKE[0]="make KERNELRELEASE=${kernelver} -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

BUILT_MODULE_NAME[0]="bcm4360"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless"
