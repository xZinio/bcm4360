# Installed by the bcm4360 driver (scripts/install.sh).
#
# The modules that would take the card before bcm4360 does: bcma, which
# claims its PCI IDs (14e4:43a0, 14e4:4360; b43 and brcmsmac reach the chip
# only through bcma), and wl, Broadcom's stock driver, which bcm4360 replaces.
blacklist bcma
blacklist wl
