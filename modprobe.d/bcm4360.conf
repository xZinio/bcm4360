# Installed by the bcm4360 driver (scripts/install.sh).
#
# These modules also claim BCM43xx PCI IDs and would grab the card first:
# the in-kernel open drivers (whose BCM4360 support is marked BROKEN) and
# Broadcom's stock "wl" module, which bcm4360 replaces.
blacklist b43
blacklist b43legacy
blacklist bcm43xx
blacklist bcma
blacklist brcm80211
blacklist brcmfmac
blacklist brcmsmac
blacklist ssb
blacklist wl
