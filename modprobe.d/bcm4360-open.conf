# Installed by the bcm4360 driver (scripts/install.sh --open).
#
# bcm4360_open, the driver without Broadcom's code, takes the card at boot:
# bcm4360 claims the same PCI IDs, so it is kept from loading by itself. The
# watchdog loads it explicitly (which a blacklist does not stop) if
# bcm4360_open cannot keep a connection. Remove this file and reboot to go
# back to bcm4360.
blacklist bcm4360
